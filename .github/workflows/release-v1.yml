name: Release v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.0.0 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; nothing to do."
            exit 0
          fi

          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ForgeGuard v1.0.0" \
            --notes "Initial public release of ForgeGuard — a portable engineering guardrails skill for coding agents. Includes repository-aware workflow control, optional GSD integration, measurable goal gating, explicit subagent approval, evidence-based verification, and diff-grounded Conventional Commit guidance."
