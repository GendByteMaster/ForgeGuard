name: Publish ForgeGuard releases

on:
  push:
    branches:
      - main
    paths:
      - "docs/releases/**"
      - ".github/workflows/release-v1.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version without the v prefix (for example 1.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify repository version
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          grep -q "version: \"$PACKAGE_VERSION\"" engineering-guardrails/SKILL.md
          test -f "docs/releases/v${PACKAGE_VERSION}.md"
          echo "VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Synchronize v1.0.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.0.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title "ForgeGuard v1.0.0 — Initial Public Release" \
              --notes-file docs/releases/v1.0.0.md
          else
            echo "v1.0.0 does not exist; skipping historical release creation."
          fi

      - name: Create or update current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES="docs/releases/${TAG}.md"
          TITLE="ForgeGuard ${TAG} — Risk Gate and CLI"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES"
          fi
