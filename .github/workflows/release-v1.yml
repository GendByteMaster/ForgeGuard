name: Publish ForgeGuard releases

on:
  push:
    branches:
      - master
      - main
    paths:
      - "package.json"
      - "engineering-guardrails/SKILL.md"
      - "docs/releases/**"
      - ".github/workflows/release-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve and verify current version
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          NOTES="docs/releases/v${PACKAGE_VERSION}.md"

          grep -q "version: \"$PACKAGE_VERSION\"" engineering-guardrails/SKILL.md
          test -f "$NOTES"

          TITLE="$(sed -n '1s/^# //p' "$NOTES")"
          test -n "$TITLE"

          echo "VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"

      - name: Synchronize v1.0.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.0.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title "ForgeGuard v1.0.0 — Initial Public Release" \
              --notes-file docs/releases/v1.0.0.md
          fi

      - name: Create or update current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --latest
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --latest
          fi
